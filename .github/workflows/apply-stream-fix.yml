name: Apply stream concurrency fix

on:
  push:
    paths:
      - PATCH_STREAM_CONCURRENCY
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch backend
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('backend.php')
          s = p.read_text()
          if 'FD_STREAM_POOL_SIZE' in s:
              print('Patch already present')
              raise SystemExit(0)

          # Constants
          needle = "define('FD_SESSION_META_PATH', fd_storage_path('storage/session_meta.json'));"
          assert needle in s, 'session meta constant not found'
          s = s.replace(needle, needle + "\ndefine('FD_STREAM_POOL_SIZE', 2);\ndefine('FD_STREAM_POOL_DIR', fd_storage_path('storage/stream-pool'));", 1)

          # Pool helpers
          marker = "/**\n * Boot MadelineProto using session-based auth."
          helpers = '''/**
           * Dedicated MTProto session pool for concurrent video streams.
           */
          function fd_stream_pool_session_path(int $slot): string
          {
              if ($slot < 1 || $slot > FD_STREAM_POOL_SIZE) {
                  throw new InvalidArgumentException('Invalid stream pool slot.');
              }
              if (!is_dir(FD_STREAM_POOL_DIR)) {
                  @mkdir(FD_STREAM_POOL_DIR, 0777, true);
              }
              return FD_STREAM_POOL_DIR . DIRECTORY_SEPARATOR . 'session-' . $slot . '.madeline';
          }

          function fd_acquire_stream_slot(int $timeoutSeconds = 25): array
          {
              if (!is_dir(FD_STREAM_POOL_DIR)) {
                  @mkdir(FD_STREAM_POOL_DIR, 0777, true);
              }
              $deadline = microtime(true) + max(1, $timeoutSeconds);
              do {
                  for ($slot = 1; $slot <= FD_STREAM_POOL_SIZE; $slot++) {
                      $handle = @fopen(FD_STREAM_POOL_DIR . DIRECTORY_SEPARATOR . 'slot-' . $slot . '.lock', 'c');
                      if ($handle !== false && @flock($handle, LOCK_EX | LOCK_NB)) {
                          return ['slot' => $slot, 'handle' => $handle, 'session' => fd_stream_pool_session_path($slot)];
                      }
                      if (is_resource($handle)) {
                          @fclose($handle);
                      }
                  }
                  usleep(100000);
              } while (microtime(true) < $deadline);
              throw new RuntimeException('All streaming slots are busy. Please try again shortly.');
          }

          function fd_release_stream_slot(array $slot): void
          {
              $handle = $slot['handle'] ?? null;
              if (is_resource($handle)) {
                  @flock($handle, LOCK_UN);
                  @fclose($handle);
              }
          }

          function fd_clear_stream_pool(): void
          {
              if (!is_dir(FD_STREAM_POOL_DIR)) {
                  return;
              }
              try {
                  $files = new RecursiveIteratorIterator(
                      new RecursiveDirectoryIterator(FD_STREAM_POOL_DIR, RecursiveDirectoryIterator::SKIP_DOTS),
                      RecursiveIteratorIterator::CHILD_FIRST
                  );
                  foreach ($files as $fileinfo) {
                      try {
                          if ($fileinfo->isDir()) @rmdir($fileinfo->getRealPath());
                          else @unlink($fileinfo->getRealPath());
                      } catch (Throwable $e) {}
                  }
                  @rmdir(FD_STREAM_POOL_DIR);
              } catch (Throwable $e) {
                  fd_log('stream pool cleanup skipped', ['error' => $e->getMessage()]);
              }
          }

          function fd_warm_stream_pool(string $botToken): array
          {
              $ready = 0;
              $errors = [];
              for ($slot = 1; $slot <= FD_STREAM_POOL_SIZE; $slot++) {
                  try {
                      [$api, $error] = fd_boot_madeline($botToken, [], fd_stream_pool_session_path($slot));
                      if ($api) {
                          unset($api);
                          $ready++;
                          fd_log('stream pool slot ready', ['slot' => $slot]);
                      } else {
                          $errors[] = 'slot ' . $slot . ': ' . ($error ?: 'unknown error');
                      }
                  } catch (Throwable $e) {
                      $errors[] = 'slot ' . $slot . ': ' . $e->getMessage();
                  }
              }
              return ['ready' => $ready, 'errors' => $errors];
          }

          '''
          assert marker in s, 'boot marker not found'
          s = s.replace(marker, helpers + marker, 1)

          # Allow fd_boot_madeline to target an independent session path.
          s = s.replace(
              'function fd_boot_madeline(?string $botToken = null, array $overrides = []): array',
              'function fd_boot_madeline(?string $botToken = null, array $overrides = [], ?string $sessionPathOverride = null): array', 1)
          s = s.replace('$sessionPath = FD_SESSION_PATH;', '$sessionPath = $sessionPathOverride ?: FD_SESSION_PATH;', 1)

          # Clear the pool whenever the bot is deliberately re-authenticated.
          s = s.replace('        fd_clear_session();\n\n        // ═══ [DIAGNOSTIC] Capture any stray output before fd_boot_madeline', '        fd_clear_stream_pool();\n        fd_clear_session();\n\n        // ═══ [DIAGNOSTIC] Capture any stray output before fd_boot_madeline', 1)

          # Warm the pool after successful login.
          login_marker = "            fd_save_session_meta(\n                $botId,\n                (string) ($self['username'] ?? ''),\n                (string) ($self['first_name'] ?? '')\n            );\n            fd_json(["
          assert login_marker in s, 'login success marker not found'
          s = s.replace(login_marker, "            fd_save_session_meta(\n                $botId,\n                (string) ($self['username'] ?? ''),\n                (string) ($self['first_name'] ?? '')\n            );\n\n            $pool = fd_warm_stream_pool($botToken);\n            fd_log('stream pool warmup complete', $pool);\n\n            fd_json([", 1)

          # Replace the download boot/stream section using stable markers.
          start = s.index('        // fd_boot_madeline() handles its own output buffering internally.', s.index("if ($path === '/api/download'"))
          end = s.index('        return true;', start) + len('        return true;')
          replacement = '''        // Use an independent session for every active stream.
          try {
              $streamSlot = fd_acquire_stream_slot();
          } catch (Throwable $slotError) {
              fd_log('no streaming slot available', ['error' => $slotError->getMessage()]);
              header('Retry-After: 3');
              fd_json(['ok' => 0, 'message' => 'All streaming slots are currently busy. Please try again shortly.'], 503);
          }

          $madeline = null;
          try {
              [$madeline, $error] = fd_boot_madeline(null, [], $streamSlot['session']);
              if (!$madeline) {
                  fd_log('stream session unavailable', ['slot' => $streamSlot['slot'], 'error' => $error]);
                  fd_json(['ok' => 0, 'message' => $error ?: 'Streaming session is not initialized. Please reconnect the bot.'], 503);
              }

              if (!method_exists($madeline, 'downloadToBrowser')) {
                  fd_json(['ok' => 0, 'message' => 'MadelineProto downloadToBrowser() is not available.'], 501);
              }

              fd_log('starting concurrent downloadToBrowser', [
                  'slot' => $streamSlot['slot'],
                  'file_id' => $fileId,
                  'file_size' => $fileSize,
                  'file_name' => $fileName,
                  'mime' => $fileMime,
              ]);
              $madeline->downloadToBrowser($fileId, null, $fileSize, $fileName, $fileMime);
              return true;
          } catch (Throwable $throwable) {
              fd_log('downloadToBrowser failed', ['slot' => $streamSlot['slot'], 'error' => $throwable->getMessage()]);
              if (!headers_sent()) {
                  fd_json(['ok' => 0, 'message' => 'File download failed.'], 500);
              }
              return true;
          } finally {
              unset($madeline);
              fd_release_stream_slot($streamSlot);
          }'''
          s = s[:start] + replacement + s[end:]

          p.write_text(s)
          PY
          php -l backend.php

      - name: Commit patch and remove one-time workflow
        run: |
          set -euo pipefail
          rm -f PATCH_STREAM_CONCURRENCY .github/workflows/apply-stream-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend.php
          git add -A .github PATCH_STREAM_CONCURRENCY
          git commit -m "Fix concurrent Telegram streaming"
          git push
